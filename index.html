<style>
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
     background:#f4f6fa;color:#0f172a}
header{background:#1F3864;color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));
       position:sticky;top:0;z-index:5}
header b{font-size:18px}
header .sub{opacity:.85;font-size:13px;margin-top:2px}
.wrap{padding:12px;max-width:980px;margin:0 auto;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{flex:1 1 auto;min-width:92px;border:1px solid #cbd5e1;background:#fff;color:#334155;
  border-radius:999px;padding:10px 12px;font-size:14px;font-weight:600}
.tabs button.on{background:#1F3864;border-color:#1F3864;color:#fff}
/* sales or staff - the same four stretches of time either way */
.which{margin-bottom:8px}
.which button{font-size:14px;padding:8px 10px}
/* one chip a tap, so a day reads left to right */
.pin,.pout{display:inline-block;border-radius:999px;padding:1px 8px;margin:1px 2px 1px 0;
  font-size:11.5px;font-weight:700}
.pin{background:#ecfdf5;color:#15803d}
.pout{background:#fef2f2;color:#b91c1c}
.dayrow{padding:7px 0;border-top:1px solid #eef2f7}
.dayrow:first-child{border-top:0}
.dayrow .d{font-size:12px;color:#64748b}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px 14px}
.card small{display:block;color:#64748b;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.card b{font-size:24px;letter-spacing:-.5px}
.sec{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px 14px;margin-bottom:12px}
.sech{font-weight:800;font-size:15.5px;margin-bottom:6px}
.sech .muted{font-weight:600;font-size:12.5px}
.sec h3{margin:0 0 8px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid #eef2f7;text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#64748b}
.r{text-align:right}.c{text-align:center}
.bar{background:#eef2f7;border-radius:6px;height:8px;overflow:hidden}
.bar i{display:block;height:100%;background:#1F3864}
.muted{color:#94a3b8;font-size:12px}
.warn{color:#b45309;font-weight:700}
.load{padding:40px 16px;text-align:center;color:#64748b}
.foot{display:flex;gap:10px;align-items:center;padding:4px 4px 0;color:#94a3b8;font-size:12px}
.foot .grow{flex:1}
.foot button{background:transparent;border:0;color:#94a3b8;font-size:12px;padding:6px}

/* the lock */
.gate{position:fixed;inset:0;background:#0f172a;color:#e2e8f0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:18px;z-index:20;padding:24px}
.gate h1{font-size:20px;margin:0;font-weight:800}
.gate .dots{display:flex;gap:14px;height:16px}
.gate .dots i{width:14px;height:14px;border-radius:50%;background:#334155;display:block}
.gate .dots i.on{background:#e2e8f0}
.pad{display:grid;grid-template-columns:repeat(3,86px);gap:12px}
.pad button{height:70px;border:0;border-radius:16px;background:#1e293b;color:#e2e8f0;font-size:26px;
  font-weight:700}
.pad button:active{background:#334155}
.pad button.alt{background:transparent;font-size:15px;font-weight:600;color:#94a3b8}
.gate .bad{color:#fca5a5;font-size:14px;min-height:20px}
#newver{display:none;background:#b45309;color:#fff;text-align:center;padding:10px 12px;
  font-size:14px;font-weight:700;cursor:pointer}
</style>

<script>
/* -------------------------------------------------------------------------
   The reports, on a phone

   The same figures the shop's own screens show, read straight from the sheet
   the counter pushes to. It is one file on the shop's own site rather than a
   page inside Google's frame, so it installs to a home screen and opens like
   an app - and it is not at the mercy of what that frame will and will not
   allow.

   The PIN is a lock on a door, not a safe. It keeps the day's takings off a
   phone somebody picks up off a counter. Anyone determined, with the link, is
   a different problem and this was never the answer to it.

   What was last read is kept on the phone, so opening it in a dead spot shows
   this morning's figures with the time they were taken, rather than a spinner
   and nothing.
------------------------------------------------------------------------- */
var EXEC = "https://script.google.com/macros/s/AKfycbz187IxcP94LwKvmyg1Ujzg9kag7tTsE6DKZehzfasm5tLqRCMTd68x9DF76wa1Vc-D/exec";
var PIN  = "1468";
/* The attendance is kept in its own sheet, with its own script, so it has its
   own address here. The PIN is the same one. */
var ATT  = "https://script.google.com/macros/s/AKfycbwEt_03-oIDaeWRVgSd7UVfsBlF83N3yNm2H0FH_SEUSyZe6sPmq2bYwnOlgQRlZEBo/exec";
var K_OK = "pf_rep_ok", K_LAST = "pf_rep_last";

var $ = function(i){ return document.getElementById(i); };
var entry = "", TAB = 0;

function get(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function put(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

/* ---------- the lock ---------- */
function drawPad(){
  var b = "";
  for (var i=1;i<=9;i++) b += '<button onclick="tap(\''+i+'\')">'+i+'</button>';
  b += '<button class="alt" onclick="back()">back</button>';
  b += '<button onclick="tap(\'0\')">0</button>';
  b += '<button class="alt" onclick="entry=\'\';dots()">clear</button>';
  $("pad").innerHTML = b;
}
function dots(){
  var d = $("dots").children;
  for (var i=0;i<4;i++) d[i].className = i < entry.length ? "on" : "";
}
function tap(n){
  if (entry.length >= 4) return;
  entry += n; dots(); $("bad").textContent = "";
  if (entry.length === 4) setTimeout(check, 120);
}
function back(){ entry = entry.slice(0,-1); dots(); }
function check(){
  if (entry === PIN) { put(K_OK, 1); open_(); }
  else { $("bad").textContent = "Not that one"; entry = ""; dots();
         if (navigator.vibrate) navigator.vibrate([60,60,60]); }
}
function lock(){ put(K_OK, 0); entry=""; dots(); $("bad").textContent=""; $("gate").style.display="flex"; }
function open_(){ $("gate").style.display = "none"; pick(TAB); }

/* ---------- the figures ---------- */
function two(n){ return (n<10?"0":"")+n; }
function iso(d){ return d.getFullYear()+"-"+two(d.getMonth()+1)+"-"+two(d.getDate()); }
function rs(n){ return "\u20B9 " + Number(n||0).toLocaleString("en-IN"); }
function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
function range(i){
  var t = new Date(), f = new Date();
  if (i===1){ f.setDate(f.getDate()-1); t.setDate(t.getDate()-1); }
  if (i===2){ f = new Date(t.getFullYear(), t.getMonth(), 1); }
  if (i===3){ var y = t.getMonth()>=3 ? t.getFullYear() : t.getFullYear()-1; f = new Date(y,3,1); }
  return [iso(f), iso(t)];
}
var WHICH = 0;   /* 0 sales, 1 staff */
var NAMES = ["Sikandar","Samir","Sahil","Nilesh","Abbas","Sachin"];

function which(w){
  WHICH = w;
  $("w0").className = (w===0 ? "on" : "");
  $("w1").className = (w===1 ? "on" : "");
  pick(TAB);
}
function cacheKey(w,i){ return (w?"s":"r") + i; }

function pick(i){
  TAB = i;
  for (var k=0;k<4;k++) $("t"+k).className = (k===i ? "on" : "");
  var r = range(i), w = WHICH, key = cacheKey(w,i);
  var all = get(K_LAST, {});
  if (all && all.tab !== undefined) all = {};          /* the older single-slot cache */
  var cached = all[key];
  /* A read saved yesterday under "Today" is about yesterday. Showing it now
     would put yesterday's takings on screen as though they were this morning's,
     so a cache for a different stretch of days is not drawn at all. */
  if (cached && cached.d && (cached.d.from !== r[0] || cached.d.to !== r[1])) cached = null;
  if (cached && cached.d && cached.d.from !== undefined) {
    paint(w, cached.d); $("when").textContent = "last read " + cached.at;
  } else { $("sub").innerHTML="&nbsp;"; $("out").className = "load"; $("out").textContent = "Loading…"; }

  var body = w
    ? { attReport:1, pin:PIN, from:r[0], to:r[1], names:NAMES }
    : { report:1,    pin:PIN, from:r[0], to:r[1] };
  var host = w ? ATT : EXEC;

  fetch(host, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" },
                body: JSON.stringify(body) })
    .then(function(x){ if (!x.ok) throw new Error("net"); return x.json(); })
    .then(function(d){
      if (WHICH !== w || TAB !== i) return;            /* they moved on while it was in the air */
      if (d && d.error === "wrong pin") return oops(BAD_PIN);
      var good = d && d.ok && d.from !== undefined
               && (w ? d.staff !== undefined : d.total !== undefined);
      if (!good) return oops(OLD_GS);
      paint(w, d);
      var at = new Date().toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"});
      /* the sheet says which script it is running, so an old one is obvious */
      $("when").textContent = "read at " + at + (d.gsVer ? "  \u00b7  sheet " + d.gsVer
                                                         : "  \u00b7  older sheet");
      all[key] = { at:at, d:d };
      put(K_LAST, all);
    })
    .catch(function(){
      if (WHICH !== w || TAB !== i) return;
      if (cached && cached.d && cached.d.from !== undefined) {
        paint(w, cached.d);
        $("when").textContent = "no internet — last read " + cached.at;
      }
      else oops("No internet. Nothing saved on this phone for "
                + (r[0]===r[1] ? dmyOf(r[0]) : "that stretch") + " yet.");
    });
}
function paint(w, d){ return w ? drawStaff(d) : draw(d); }

/* ---------- the staff, day by day ---------- */
function clockOf(t){
  var m = /^(\d{1,2}):(\d{2})/.exec(String(t||"")); if (!m) return String(t||"");
  var h = Number(m[1]), ap = h<12 ? "am" : "pm"; h = h%12; if (!h) h = 12;
  return h + ":" + m[2] + " " + ap;
}
function hrs(mins){
  if (!mins) return "—";
  var h = Math.floor(mins/60), m = mins%60;
  return h + "h" + (m ? " " + (m<10?"0":"") + m + "m" : "");
}
function dmyOf(d){
  var p = String(d).split("-");
  return p[2] + "-" + p[1] + "-" + p[0];
}
function dmyShort(d){
  var mo = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var p = String(d).split("-");
  return Number(p[2]) + " " + mo[Number(p[1])-1];
}
function drawStaff(d){
  $("sub").textContent = (d.from===d.to ? d.from : d.from + " to " + d.to);
  var staff = (d.staff||[]).filter(function(p){ return p.present || p.days.length; });
  if (!staff.length) {
    $("out").className = "load";
    $("out").innerHTML = "Nothing marked in this stretch.";
    return;
  }
  staff.sort(function(a,b){ return b.mins - a.mins; });
  var h = '<div class="cards">';
  h += card("Days worked", staff.reduce(function(a,p){ return a + p.present; }, 0));
  h += card("Hours", hrs(staff.reduce(function(a,p){ return a + p.mins; }, 0)));
  h += "</div>";

  staff.forEach(function(p){
    h += '<div class="sec"><div class="sech">' + esc(p.name)
       + ' <span class="muted">' + p.present + (p.present===1?" day":" days")
       + ' · ' + hrs(p.mins) + '</span></div>';
    if (!p.days.length) h += '<div class="dayrow muted">nothing marked</div>';
    p.days.slice().reverse().forEach(function(x){
      h += '<div class="dayrow"><div class="d">' + dmyShort(x.date)
         + ' · ' + hrs(x.mins) + (x.open ? ' · <b>never marked out</b>' : '') + '</div><div>'
         + x.times.map(function(t,ix){
             return '<span class="' + (ix%2 ? "pout" : "pin") + '">'
                  + (ix%2 ? "out " : "in ") + clockOf(t) + '</span>';
           }).join("")
         + '</div></div>';
    });
    h += '</div>';
  });
  $("out").className = "";
  $("out").innerHTML = h;
}

var BAD_PIN = "The PIN in this app does not match the one in the sheet.";
var OLD_GS  = "The sheet answered, but not with a report. The Apps Script file "
            + "is the older one \u2014 put the new OnlineReports.gs in and deploy again.";
function oops(m){ $("sub").innerHTML = "&nbsp;"; $("out").className = "load"; $("out").innerHTML = esc(m); }
function card(l,v){ return '<div class="card"><small>'+l+"</small><b>"+v+"</b></div>"; }

function draw(d){
  $("sub").textContent = (d.from===d.to ? d.from : d.from+" to "+d.to)
    + (d.lastSale ? "  \u00b7  last bill " + d.lastSale : "");
  var h = '<div class="cards">';
  h += card("Sales", rs(d.total));
  h += card("Bills", d.bills);
  h += card("Pairs", d.pairs);
  h += card("Average bill", rs(d.avg));
  if (d.retTotal)   h += card("Returns", rs(d.retTotal)+" \u00b7 "+d.retPairs+" pairs");
  if (d.retTotal)   h += card("Net of returns", rs(d.net));
  if (d.purchases)  h += card("Purchases", rs(d.purchValue)+" \u00b7 "+d.purchases+" GRN");
  if (d.shortPairs) h += card("Billed short", '<span class="warn">'+d.shortPairs+" pairs</span>");
  h += "</div>";

  if (d.days.length > 1) {
    var mx = 0; d.days.forEach(function(x){ if (x.v > mx) mx = x.v; });
    h += '<div class="sec"><h3>Day by day</h3><table>';
    d.days.forEach(function(x){
      h += "<tr><td>"+x.d.slice(8)+"-"+x.d.slice(5,7)+'</td><td class="r">'+rs(x.v)
         + '</td><td style="width:50%"><div class="bar"><i style="width:'+(x.v/mx*100)+'%"></i></div></td></tr>';
    });
    h += "</table></div>";
  }
  if (d.staff.length) {
    h += '<div class="sec"><h3>Salesmen</h3><table><tr><th>Name</th><th class="c">Bills</th>'
       + '<th class="c">Pairs</th><th class="r">Value</th><th class="r">1%</th></tr>';
    d.staff.forEach(function(s){
      h += "<tr><td><b>"+esc(s.name)+'</b></td><td class="c">'+s.bills+'</td><td class="c">'+s.pairs
         + '</td><td class="r">'+rs(s.value)+'</td><td class="r">'+rs(s.comm)+"</td></tr>";
    });
    h += "</table></div>";
  }
  if (d.top.length) {
    var mq = d.top[0].qty || 1;
    h += '<div class="sec"><h3>What sold</h3><table><tr><th>Item</th><th class="c">Pairs</th>'
       + '<th class="r">Value</th><th></th></tr>';
    d.top.forEach(function(m){
      h += "<tr><td>"+esc(m.k)+'</td><td class="c">'+m.qty+'</td><td class="r">'+rs(m.val)
         + '</td><td style="width:28%"><div class="bar"><i style="width:'+(m.qty/mq*100)+'%"></i></div></td></tr>';
    });
    d.side.forEach(function(m){
      h += "<tr><td>"+esc(m.k)+' <span class="muted">no stock kept</span></td><td class="c">'+m.qty
         + '</td><td class="r">'+rs(m.val)+"</td><td></td></tr>";
    });
    h += "</table></div>";
  }
  if (d.short.length) {
    h += '<div class="sec"><h3>Billed out of stock that was not there</h3><table>'
       + '<tr><th>Item</th><th class="c">Size</th><th class="c">Short</th><th>Bill</th></tr>';
    d.short.forEach(function(s){
      h += "<tr><td>"+esc(s.item)+" "+esc(s.colour)+'</td><td class="c">'+esc(s.size)
         + '</td><td class="c warn">'+s.short+"</td><td>"+esc(s.inv)+"</td></tr>";
    });
    h += "</table></div>";
  }
  if (!d.bills && !d.retTotal) h = '<div class="load">Nothing billed in this period.</div>';
  var o = $("out"); o.className = ""; o.innerHTML = h;
}


/* ---------- keeping itself up to date ----------
   Added to a home screen, the page is kept by the phone, and a new one put on
   the site is not picked up until the phone feels like it. So it asks the site
   for its own file, past the phone's own copy, and compares the build. A newer
   one on the site puts a bar at the top; tapping it loads the new page. */
var APP_BUILD = "1.0.50";
function checkBuild(){
  if (!navigator.onLine) return;
  fetch(location.href.split("#")[0] + (location.search?"&":"?") + "v=" + Date.now(),
        { cache:"no-store" })
    .then(function(x){ return x.ok ? x.text() : ""; })
    .then(function(t){
      var m = /var APP_BUILD = "([^"]+)"/.exec(t||"");
      if (!m || m[1] === APP_BUILD) return;
      var b = document.getElementById("newver");
      if (b) { b.style.display = "block"; b.textContent =
        "A newer version is on the site \u2014 tap to update"; }
    })
    .catch(function(){});
}
checkBuild();
setInterval(checkBuild, 30*60*1000);

drawPad(); dots();
if (get(K_OK, 0)) open_(); else $("gate").style.display = "flex";
document.addEventListener("visibilitychange", function(){
  if (!document.hidden && get(K_OK,0)) pick(TAB);
});
</script>
</body>
